name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore MediAssistAI.sln

      - name: Build solution
        run: dotnet build MediAssistAI.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test MediAssistAI.sln --configuration Release --no-build --no-restore
